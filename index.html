<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoSim: La Ruta del Cacao</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --nature: #06b6d4;
            --society: #f97316;
            --transition-speed: 0.8s;
        }

        * { 
            box-sizing: border-box; margin: 0; padding: 0; 
            font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent;
        }

        body {
            /* El fondo cambiará con JS dependiendo de la naturaleza */
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex; justify-content: center;
            height: 100dvh; overflow: hidden; 
            transition: background-color var(--transition-speed) ease;
        }

        #app {
            width: 100%; max-width: 480px; height: 100dvh;
            display: flex; flex-direction: column;
            background: rgba(15, 23, 42, 0.95); /* Panel semitransparente */
            backdrop-filter: blur(5px);
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            position: relative;
        }

        /* CABECERA (Dimensiones) */
        header {
            padding: 15px 15px 10px 15px;
            background: rgba(30, 41, 59, 0.9);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
        }

        .header-title { text-align: center; font-size: 12px; font-weight: 700; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase;}

        /* BARRAS DE DIMENSIÓN */
        .dimension-bars { display: flex; flex-direction: column; gap: 8px; }
        .dim-row { display: flex; align-items: center; font-size: 11px; font-weight: 600;}
        .dim-label { width: 85px; text-align: left; }
        .bar-bg { flex-grow: 1; height: 10px; background: #0f172a; border-radius: 5px; overflow: hidden; margin: 0 10px; border: 1px solid #334155;}
        .bar-fill { height: 100%; transition: width 0.5s ease, background 0.5s ease; width: 50%; }
        
        .bar-economy { background: var(--success); }
        .bar-society { background: var(--society); }
        .bar-nature { background: var(--nature); }

        /* ÁREA DE CONTENIDO */
        main {
            flex-grow: 1; overflow-y: auto;
            padding: 20px; padding-bottom: 120px; 
            display: flex; flex-direction: column;
        }

        /* ESCENARIO VISUAL (Entorno Interactivo) */
        #scene-container {
            width: 100%; height: 140px;
            border-radius: 15px; margin-bottom: 20px;
            display: flex; justify-content: center; align-items: center;
            font-size: 70px; /* Tamaño del emoji del entorno */
            background: #0f172a;
            border: 2px dashed #334155;
            transition: all var(--transition-speed) ease;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        #scene-icon { z-index: 2; transition: transform 0.5s ease; }

        /* HISTORIA Y PERSONAJE */
        .character-card {
            display: flex; align-items: flex-start;
            background: var(--panel-bg); padding: 15px; border-radius: 15px;
            margin-bottom: 15px; border-left: 4px solid var(--primary);
            animation: slideIn 0.4s ease forwards;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

        .avatar {
            width: 45px; height: 45px; display: flex; justify-content: center; align-items: center;
            font-size: 24px; margin-right: 15px; flex-shrink: 0; background: #0f172a; border-radius: 50%;
            border: 2px solid;
        }

        .dialogue { flex: 1; }
        .dialogue strong { display: block; font-size: 14px; margin-bottom: 4px; color: var(--primary);}
        .dialogue p { text-align: left; font-size: 14px; color: #e2e8f0; line-height: 1.5;}

        /* OPCIONES (Decisiones) */
        .options-container { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        
        .decision-btn {
            background: #334155; color: white; border: 2px solid #475569;
            padding: 15px; border-radius: 12px; font-size: 14px; font-weight: 600;
            text-align: left; cursor: pointer; transition: all 0.2s ease;
            position: relative; overflow: hidden;
        }
        
        .decision-btn:active { transform: scale(0.98); background: #475569; }
        .decision-btn:hover { border-color: var(--primary); }

        /* BOTÓN FIJO PARA AVANZAR */
        footer {
            position: fixed; bottom: 0; left: 0; width: 100%;
            display: flex; justify-content: center;
            background: linear-gradient(to top, #0f172a 90%, transparent);
            z-index: 999; padding-bottom: env(safe-area-inset-bottom);
        }
        
        #btn-next {
            background: var(--primary); color: white; border: none; padding: 16px; font-size: 16px;
            font-weight: 700; border-radius: 12px; width: calc(100% - 30px); max-width: 450px;
            margin: 15px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            display: none; /* Oculto hasta que se tome una decisión */
        }
        #btn-next:active { transform: scale(0.96); }

    </style>
</head>
<body>

    <div id="app">
        <!-- CABECERA: Dimensiones del Juego -->
        <header>
            <div class="header-title">Tus Dimensiones</div>
            <div class="dimension-bars">
                <div class="dim-row">
                    <div class="dim-label">Economía 💰</div>
                    <div class="bar-bg"><div class="bar-fill bar-economy" id="bar-eco" style="width: 50%;"></div></div>
                </div>
                <div class="dim-row">
                    <div class="dim-label">Sociedad 🏘️</div>
                    <div class="bar-bg"><div class="bar-fill bar-society" id="bar-soc" style="width: 50%;"></div></div>
                </div>
                <div class="dim-row">
                    <div class="dim-label">Naturaleza 🌿</div>
                    <div class="bar-bg"><div class="bar-fill bar-nature" id="bar-nat" style="width: 50%;"></div></div>
                </div>
            </div>
        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main id="main-content">
            <!-- Escenario Visual (Cambia según la Naturaleza) -->
            <div id="scene-container">
                <div id="scene-icon">🌍</div>
            </div>

            <!-- Cuadro de Diálogo -->
            <div class="character-card" id="character-card">
                <div class="avatar" id="char-avatar">👨🏽‍💼</div>
                <div class="dialogue">
                    <strong id="char-name">Sistema</strong>
                    <p id="story-text">Cargando historia...</p>
                </div>
            </div>

            <!-- Botones de Decisión (Se generan con JS) -->
            <div class="options-container" id="options-container">
                <!-- Aquí JavaScript inyecta los botones -->
            </div>
        </main>

        <!-- BOTÓN CONTINUAR -->
        <footer>
            <button id="btn-next">Continuar ➔</button>
        </footer>
    </div>

    <script>
        // --- 1. ESTADO DEL JUEGO ---
        let state = {
            eco: 50,  // Economía
            soc: 50,  // Sociedad
            nat: 50,  // Naturaleza
            chapter: 0 // Capítulo actual de la historia
        };

        // --- 2. LA HISTORIA (8 Escenarios Interactivos) ---
        const storyData = [
            {
                title: "Capítulo 1: La Oportunidad",
                charName: "El Agricultor",
                avatar: "👨🏽‍🌾",
                text: "¡Hola, Gerente! La demanda de chocolate está por las nubes. Si procesamos todo el cacao posible, nos haremos ricos. ¿Qué decides?",
                options: [
                    { text: "Producir al 100% (Maximizar dinero)", eco: 30, soc: -10, nat: -30, next: 1 },
                    { text: "Producir moderadamente (Equilibrio)", eco: 10, soc: 0, nat: -10, next: 1 }
                ]
            },
            {
                title: "Capítulo 2: El Río se Queja",
                charName: "La Comunidad",
                avatar: "👨🏽‍👩🏽‍👧🏽",
                text: "Gerente, el río está lleno de desechos de tu planta. Los niños se están enfermando. ¡Necesitamos que hagas algo!",
                options: [
                    { text: "Ignorarlos, mi prioridad es la empresa.", eco: 10, soc: -30, nat: -20, next: 2 },
                    { text: "Invertir en filtros de agua (Costo alto).", eco: -20, soc: 30, nat: 30, next: 2 }
                ]
            },
            {
                title: "Capítulo 3: La Llegada del Estado",
                charName: "El Estado",
                avatar: "🏛️",
                text: "Hemos detectado la Externalidad Negativa. Para proteger el río, impondremos un Impuesto Pigouviano de $10 por tonelada de contaminación.",
                options: [
                    { text: "Aceptar el impuesto y adaptarse.", eco: -15, soc: 20, nat: 25, next: 3 },
                    { text: "Evadir impuestos (Corrupción).", eco: 25, soc: -20, nat: -25, next: 3 }
                ]
            },
            {
                title: "Capítulo 4: Innovación Agroindustrial",
                charName: "Tu Ingeniero Jefe",
                avatar: "👷🏽‍♂️",
                text: "Con el impuesto, nuestra planta necesita cambiar. Podemos implementar un sistema agroforestal o usar químicos baratos.",
                options: [
                    { text: "Sistema Agroforestal (Sombra y árboles).", eco: -10, soc: 10, nat: 30, next: 4 },
                    { text: "Químicos baratos para acelerar producción.", eco: 20, soc: -10, nat: -30, next: 4 }
                ]
            },
            {
                title: "Capítulo 5: El Sello Orgánico",
                charName: "El Consumidor",
                avatar: "🛒",
                text: "Vi tu producto. Si obtienes la Certificación Orgánica y de Comercio Justo, estoy dispuesto a pagar el doble por tu chocolate.",
                options: [
                    { text: "Pagar la certificación y mejorar procesos.", eco: 25, soc: 20, nat: 20, next: 5 },
                    { text: "Es mucho papeleo, seguiré vendiendo barato.", eco: -10, soc: -5, nat: 0, next: 5 }
                ]
            },
            {
                title: "Capítulo 6: El Pago por Servicios Ambientales (PSA)",
                charName: "El Río",
                avatar: "🌊",
                text: "El gobierno ofrece un pago si conservas el bosque de ribera que rodea tu planta para proteger el agua.",
                options: [
                    { text: "Aceptar el pago y conservar el bosque.", eco: 15, soc: 15, nat: 30, next: 6 },
                    { text: "Talar el bosque para sembrar más cacao.", eco: 20, soc: -10, nat: -30, next: 6 }
                ]
            },
            {
                title: "Capítulo 7: Balance Final",
                charName: "Junta Directiva",
                avatar: "👔",
                text: "Gerente, es momento de revisar los resultados. ¿Cómo queda nuestra empresa y nuestro entorno?",
                options: [
                    { text: "Ver Resultados Finales", eco: 0, soc: 0, nat: 0, next: 7 }
                ]
            }
        ];

        // --- 3. LÓGICA DE LA INTERFAZ (DOM) ---
        const ui = {
            barEco: document.getElementById('bar-eco'),
            barSoc: document.getElementById('bar-soc'),
            barNat: document.getElementById('bar-nat'),
            charCard: document.getElementById('character-card'),
            charAvatar: document.getElementById('char-avatar'),
            charName: document.getElementById('char-name'),
            storyText: document.getElementById('story-text'),
            optionsContainer: document.getElementById('options-container'),
            btnNext: document.getElementById('btn-next'),
            mainContent: document.getElementById('main-content'),
            sceneContainer: document.getElementById('scene-container'),
            sceneIcon: document.getElementById('scene-icon'),
            body: document.body
        };

        // --- 4. ACTUALIZAR ENTORNO VISUAL ---
        function updateEnvironment() {
            // Lógica de colores y emojis basados en la Naturaleza
            if (state.nat >= 70) {
                // Entorno Saludable
                ui.body.style.backgroundColor = "#064e3b"; // Verde oscuro
                ui.sceneContainer.style.background = "linear-gradient(180deg, #065f46, #022c22)";
                ui.sceneContainer.style.borderColor = "#10b981";
                ui.sceneIcon.innerText = "🌳";
                ui.sceneIcon.style.transform = "scale(1.2)";
            } else if (state.nat >= 40) {
                // Entorno Neutro
                ui.body.style.backgroundColor = "#0f172a"; // Azul oscuro original
                ui.sceneContainer.style.background = "#0f172a";
                ui.sceneContainer.style.borderColor = "#334155";
                ui.sceneIcon.innerText = "🏞️";
                ui.sceneIcon.style.transform = "scale(1)";
            } else {
                // Entorno Contaminado
                ui.body.style.backgroundColor = "#450a0a"; // Rojo oscuro
                ui.sceneContainer.style.background = "linear-gradient(180deg, #7f1d1d, #450a0a)";
                ui.sceneContainer.style.borderColor = "#ef4444";
                ui.sceneIcon.innerText = "🏭";
                ui.sceneIcon.style.transform = "scale(1.2)";
            }
        }

        // --- 5. ACTUALIZAR BARRAS ---
        function updateBars() {
            // Asegurar que no bajen de 0 ni suban de 100
            state.eco = Math.max(0, Math.min(100, state.eco));
            state.soc = Math.max(0, Math.min(100, state.soc));
            state.nat = Math.max(0, Math.min(100, state.nat));

            ui.barEco.style.width = state.eco + '%';
            ui.barSoc.style.width = state.soc + '%';
            ui.barNat.style.width = state.nat + '%';

            // Cambiar color si está crítico
            ui.barEco.style.background = state.eco < 30 ? '#ef4444' : '#10b981';
            ui.barSoc.style.background = state.soc < 30 ? '#ef4444' : '#f97316';
            ui.barNat.style.background = state.nat < 30 ? '#ef4444' : '#06b6d4';
            
            updateEnvironment();
        }

        // --- 6. RENDERIZAR CAPÍTULO ---
        function renderChapter() {
            const data = storyData[state.chapter];
            
            // Actualizar textos
            ui.charName.innerText = data.charName;
            ui.charAvatar.innerText = data.avatar;
            ui.storyText.innerText = data.text;
            
            // Animación de entrada de la tarjeta
            ui.charCard.style.animation = 'none';
            ui.charCard.offsetHeight; /* trigger reflow */
            ui.charCard.style.animation = 'slideIn 0.4s ease forwards';

            // Limpiar botones anteriores
            ui.optionsContainer.innerHTML = '';
            ui.btnNext.style.display = 'none';

            // Generar nuevos botones
            data.options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'decision-btn';
                btn.innerText = option.text;
                btn.onclick = () => makeDecision(option);
                ui.optionsContainer.appendChild(btn);
            });

            // Scroll al inicio
            ui.mainContent.scrollTop = 0;
        }

        // --- 7. TOMAR DECISIÓN ---
        function makeDecision(option) {
            // Aplicar efectos a las dimensiones
            state.eco += option.eco;
            state.soc += option.soc;
            state.nat += option.nat;

            // Actualizar UI
            updateBars();

            // Deshabilitar botones para que no hagan doble clic
            const btns = ui.optionsContainer.querySelectorAll('.decision-btn');
            btns.forEach(b => b.style.pointerEvents = 'none');

            // Mostrar el botón de "Continuar" fijo abajo
            ui.btnNext.style.display = 'block';
            
            // Configurar qué hará el botón continuar
            ui.btnNext.onclick = () => {
                state.chapter = option.next;
                if (state.chapter >= storyData.length) {
                    showEndGame();
                } else {
                    renderChapter();
                }
            };
        }

        // --- 8. PANTALLA FINAL ---
        function showEndGame() {
            // Ocultar botón fijo
            ui.btnNext.style.display = 'none';
            
            let finalMessage = "";
            let title = "";
            
            if (state.eco > 60 && state.nat > 60 && state.soc > 60) {
                title = "🏆 ¡Desarrollo Sostenible!";
                finalMessage = "Lograste un equilibrio perfecto. Tu empresa es rentable, la comunidad te apoya y el río está limpio. ¡Eres un Ingeniero Agroindustrial ejemplar!";
            } else if (state.eco > 70 && state.nat < 40) {
                title = "💸 Rico, pero Destructivo";
                finalMessage = "Ganaste mucho dinero, pero destruiste el río y la comunidad te odia. El Estado probablemente te clausure pronto. El Impuesto Pigouviano existe para evitar esto.";
            } else if (state.nat > 70 && state.eco < 40) {
                title = "🌿 Héroe Ecológico en Banca Rota";
                finalMessage = "El río está hermoso, pero tu empresa está en quiebra. Recuerda que la economía también importa para el bienestar social.";
            } else {
                title = "⚖️ Supervivencia";
                finalMessage = "No tomaste las mejores decisiones, pero lograste mantener la empresa a flote. Podrías haber maximizado el bienestar social.";
            }

            // Modificar la interfaz para mostrar el final
            document.querySelector('header').style.display = 'none'; // Ocultar barras
            ui.storyText.innerText = finalMessage;
            ui.charName.innerText = title;
            ui.charAvatar.innerText = "📊";
            
            // Botón de reiniciar
            ui.btnNext.innerText = "Jugar de Nuevo 🔄";
            ui.btnNext.style.display = 'block';
            ui.btnNext.onclick = () => location.reload();
            
            // Actualizar el escenario según el final
            updateEnvironment();
            ui.sceneIcon.innerText = "🌍";
        }

        // --- INICIALIZAR JUEGO ---
        window.onload = () => {
            updateBars();
            renderChapter();
        };

    </script>
</body>
</html>
