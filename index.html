<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoSim: La Ruta del Cacao</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a; --panel-bg: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --primary: #3b82f6; --success: #10b981;
            --danger: #ef4444; --warning: #f59e0b; --nature: #06b6d4;
            --society: #f97316; --state-color: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            height: 100%; width: 100%; margin: 0; 
            background-color: var(--bg-dark); overflow: hidden; 
        }

        /* CONTENEDOR PRINCIPAL */
        #app {
            width: 100%; height: 100dvh; display: flex; flex-direction: column; 
            background: var(--bg-dark); position: relative;
        }

        /* CABECERA */
        header {
            padding: 15px 15px 10px 15px; background: rgba(30, 41, 59, 0.98);
            border-bottom: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; z-index: 10;
        }
        .header-title { text-align: center; font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase;}
        .dimension-bars { display: flex; flex-direction: column; gap: 6px; }
        .dim-row { display: flex; align-items: center; font-size: 11px; font-weight: 600;}
        .dim-label { width: 80px; text-align: left; }
        .bar-bg { flex-grow: 1; height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; margin: 0 10px; border: 1px solid #334155;}
        .bar-fill { height: 100%; transition: width 0.5s ease, background 0.5s ease; width: 50%; }
        .bar-economy { background: var(--success); }
        .bar-society { background: var(--society); }
        .bar-nature { background: var(--nature); }

        /* ÁREA SCROLLABLE */
        main { 
            flex-grow: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding: 15px; padding-bottom: 100px; display: flex; flex-direction: column; 
        }

        /* ESCENARIO VISUAL */
        #scene {
            width: 100%; height: 140px; border-radius: 12px; margin-bottom: 15px;
            position: relative; overflow: hidden; border: 2px solid #334155;
            flex-shrink: 0; background: #0f172a; transition: border-color 0.5s;
        }
        .sky { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #38bdf8; transition: background 1s ease; }
        .sky.polluted { background: #78350f; }
        .sun { position: absolute; top: 15px; right: 20px; width: 30px; height: 30px; background: #fde047; border-radius: 50%; box-shadow: 0 0 15px #fde047; transition: all 1s; }
        .sun.polluted { opacity: 0.2; transform: scale(0.8); background: #9ca3af; box-shadow: none;}
        .factory { position: absolute; bottom: 0; left: 10%; width: 80px; height: 60px; display: flex; align-items: flex-end; }
        .building { width: 60px; height: 40px; background: #475569; border: 2px solid #334155; position: relative; z-index: 2; }
        .chimney { position: absolute; bottom: 40px; left: 5px; width: 15px; height: 35px; background: #334155; border: 2px solid #1e293b; z-index: 1; }
        .chimney-2 { left: 30px; height: 25px; }
        .smoke { position: absolute; width: 15px; height: 15px; background: #64748b; border-radius: 50%; bottom: 75px; left: 10px; opacity: 0; transition: opacity 1s; animation: floatSmoke 3s infinite linear; }
        .smoke-2 { left: 35px; bottom: 65px; animation-delay: 1.5s; width: 20px; height: 20px; }
        .smoke.active { opacity: 0.9; background: #1f2937; }
        @keyframes floatSmoke { 0% { transform: translateY(0) scale(1); opacity: 0.8; } 100% { transform: translateY(-30px) scale(2); opacity: 0; } }
        .nature { position: absolute; bottom: 0; right: 5%; width: 100px; height: 50px; z-index: 3; }
        .tree { position: absolute; bottom: 0; width: 20px; height: 20px; background: #22c55e; border-radius: 50% 50% 0 0; transition: all 1s; }
        .tree::after { content: ''; position: absolute; bottom: -12px; left: 8px; width: 4px; height: 12px; background: #78350f; }
        .tree-1 { right: 10px; bottom: 10px; }
        .tree-2 { right: 30px; bottom: 5px; width: 15px; height: 15px; }
        .tree.polluted { background: #78350f; transform: scale(0.7); }
        .river { position: absolute; bottom: 0; right: 0; width: 100%; height: 8px; background: #0284c7; transition: background 1s; }
        .river.polluted { background: #451a03; }

        /* TARJETA DE DIÁLOGO */
        .character-card {
            display: flex; align-items: flex-start; background: var(--panel-bg); padding: 15px; border-radius: 12px;
            margin-bottom: 15px; border-left: 4px solid var(--primary); flex-shrink: 0;
        }
        .avatar {
            width: 40px; height: 40px; display: flex; justify-content: center; align-items: center;
            font-size: 22px; margin-right: 12px; flex-shrink: 0; background: #0f172a; border-radius: 50%;
            border: 2px solid var(--primary);
        }
        .dialogue { flex: 1; }
        .dialogue strong { display: block; font-size: 13px; margin-bottom: 4px; color: var(--primary);}
        .dialogue p { text-align: left; font-size: 13px; color: #e2e8f0; line-height: 1.5;}

        .character-card.state-doc { border-left: none; border: 2px solid var(--state-color); background: rgba(139, 92, 246, 0.1); }
        .character-card.state-doc .avatar { border-color: var(--state-color); }
        .character-card.state-doc strong { color: var(--state-color); text-transform: uppercase; font-size: 11px; letter-spacing: 1px;}
        .character-card.state-doc p { font-family: monospace; color: #ddd6fe;}

        /* OPCIONES */
        .instruction-text { text-align: center; font-size: 11px; color: var(--warning); margin-bottom: 10px; font-weight: 600; display: none; }
        .options-container { display: flex; flex-direction: column; gap: 10px;}
        .decision-btn {
            background: #334155; color: white; border: 2px solid #475569; padding: 14px; border-radius: 10px;
            font-size: 13px; font-weight: 600; text-align: left; cursor: pointer; transition: all 0.2s ease;
        }
        .decision-btn:active { transform: scale(0.98); background: #475569; }

        /* BOTÓN FIJO INFERIOR */
        footer {
            position: fixed; bottom: 0; left: 0; width: 100%;
            padding: 15px 15px calc(15px + env(safe-area-inset-bottom)) 15px;
            background: linear-gradient(to top, #0f172a 90%, transparent); z-index: 100;
        }
        #btn-action {
            background: var(--primary); color: white; border: none; padding: 16px; font-size: 15px;
            font-weight: 700; border-radius: 10px; width: 100%; cursor: pointer; 
            transition: transform 0.1s, background 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #btn-action:active { transform: scale(0.96); }
        #btn-action:disabled { background: #475569; color: #94a3b8; box-shadow: none;}

        /* PANTALLA DE RESULTADOS */
        #results-screen { display: none; flex-direction: column; animation: slideIn 0.5s ease forwards;}
        .score-circle {
            width: 120px; height: 120px; border-radius: 50%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; margin: 0 auto 15px auto; border: 5px solid var(--primary);
            background: #0f172a; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
        .score-number { font-size: 32px; font-weight: 700; line-height: 1; color: var(--primary);}
        .score-text { font-size: 11px; color: var(--text-muted); margin-top: 2px;}
        .result-title { text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .result-desc { text-align: center; font-size: 12px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4;}
        
        .final-dims-container { background: var(--panel-bg); border-radius: 12px; padding: 15px; margin-bottom: 20px; border: 1px solid #334155; }
        .final-dims-title { font-size: 13px; font-weight: 700; text-align: center; margin-bottom: 12px; color: #cbd5e1; text-transform: uppercase;}
        .final-dim-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 12px; font-weight: 600; }
        .final-dim-label { display: flex; align-items: center; width: 100px; }
        .final-dim-bar-bg { flex-grow: 1; height: 10px; background: #0f172a; border-radius: 5px; margin: 0 8px; overflow: hidden; border: 1px solid #334155; }
        .final-dim-bar-fill { height: 100%; border-radius: 5px; }
        .final-dim-value { width: 35px; text-align: right; font-size: 13px;}

        .history-title { font-size: 14px; font-weight: 700; border-bottom: 2px solid #334155; padding-bottom: 8px; margin-bottom: 12px; color: var(--text-main);}
        .history-item { background: var(--panel-bg); padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 12px; border-left: 4px solid; }
        .history-item.good { border-color: var(--success); }
        .history-item.bad { border-color: var(--danger); }
        .history-header { font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 5px;}
        .history-header.good { color: var(--success); }
        .history-header.bad { color: var(--danger); }
        .history-choice { color: #cbd5e1; font-style: italic; margin-bottom: 4px;}
        .history-feedback { font-size: 10px; color: var(--text-muted); }

        @keyframes slideIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="app">
        <header id="top-header">
            <div class="header-title">Dimensiones en Tiempo Real</div>
            <div class="dimension-bars">
                <div class="dim-row"><div class="dim-label">Economía 💰</div><div class="bar-bg"><div class="bar-fill bar-economy" id="bar-eco"></div></div></div>
                <div class="dim-row"><div class="dim-label">Sociedad 🏘️</div><div class="bar-bg"><div class="bar-fill bar-society" id="bar-soc"></div></div></div>
                <div class="dim-row"><div class="dim-label">Naturaleza 🌿</div><div class="bar-bg"><div class="bar-fill bar-nature" id="bar-nat"></div></div></div>
            </div>
        </header>

        <main id="main-content">
            <div id="game-ui" style="display: flex; flex-direction: column; flex-grow: 1;">
                
                <!-- ESCENARIO -->
                <div id="scene">
                    <div class="sky" id="sky"></div>
                    <div class="sun" id="sun"></div>
                    <div class="river" id="river"></div>
                    <div class="factory">
                        <div class="chimney"></div><div class="chimney chimney-2"></div>
                        <div class="smoke" id="smoke1"></div><div class="smoke smoke-2" id="smoke2"></div>
                        <div class="building"></div>
                    </div>
                    <div class="nature">
                        <div class="tree tree-1" id="tree1"></div><div class="tree tree-2" id="tree2"></div>
                    </div>
                </div>

                <!-- DIÁLOGO -->
                <div class="character-card" id="character-card">
                    <div class="avatar" id="char-avatar">👨🏽‍💼</div>
                    <div class="dialogue">
                        <strong id="char-name">Sistema</strong>
                        <p id="story-text">Cargando...</p>
                    </div>
                </div>

                <p class="instruction-text" id="instruction-text">👇 Elige una decisión para continuar</p>
                <div class="options-container" id="options-container"></div>
            </div>

            <!-- RESULTADOS -->
            <div id="results-screen">
                <div class="score-circle">
                    <div class="score-number" id="score-display">0</div>
                    <div class="score-text">de 600 pts</div>
                </div>
                <h2 class="result-title" id="result-title">Título</h2>
                <p class="result-desc" id="result-desc">Descripción final...</p>

                <div class="final-dims-container">
                    <div class="final-dims-title">📊 Reporte de Dimensiones Finales</div>
                    <div class="final-dim-row">
                        <div class="final-dim-label">Economía 💰</div>
                        <div class="final-dim-bar-bg"><div class="final-dim-bar-fill" id="final-bar-eco" style="background: var(--success);"></div></div>
                        <div class="final-dim-value" id="final-val-eco" style="color: var(--success);">0%</div>
                    </div>
                    <div class="final-dim-row">
                        <div class="final-dim-label">Sociedad 🏘️</div>
                        <div class="final-dim-bar-bg"><div class="final-dim-bar-fill" id="final-bar-soc" style="background: var(--society);"></div></div>
                        <div class="final-dim-value" id="final-val-soc" style="color: var(--society);">0%</div>
                    </div>
                    <div class="final-dim-row">
                        <div class="final-dim-label">Naturaleza 🌿</div>
                        <div class="final-dim-bar-bg"><div class="final-dim-bar-fill" id="final-bar-nat" style="background: var(--nature);"></div></div>
                        <div class="final-dim-value" id="final-val-nat" style="color: var(--nature);">0%</div>
                    </div>
                </div>

                <h3 class="history-title">📋 Historial de Decisiones</h3>
                <div id="history-container"></div>
            </div>
        </main>

        <footer>
            <button id="btn-action">Aceptar el Reto e Iniciar ➔</button>
        </footer>
    </div>

    <script>
        // ESTADO GLOBAL
        let state = { eco: 50, soc: 50, nat: 50, chapter: -1, score: 0, history: [] };
        let currentPhase = "intro"; 

        const ui = {

            tree2: document.getElementById('tree2'),
            smoke1: document.getElementById('smoke1'),

            // Resultados
            gameUI: document.getElementById('game-ui'),

            {

                    { text: "Producir moderadamente (Equilibrio)", eco: 10, soc: 0, nat: -10, next: 1, isGood: true, points: 100, feedback: "Buena elección. Un crecimiento controlado permite evaluar los impactos ambientales a tiempo." }

            {

                text: "RESOLUCIÓN N° 402.\nEstimado Gerente. Su nivel de Naturaleza está en [NAT]%. Se impone un Impuesto Pigouviano sobre el daño marginal. ¿Acepta la regulación?",
                options: [
                    { text: "Aceptar el impuesto y adaptar la planta.", eco: -15, soc: 20, nat: 25, next: 3, isGood: true, points: 100, feedback: "Aceptar el impuesto internaliza la externalidad." },
                    { text: "Evadir impuestos (Buscar sobornos).", eco: 25, soc: -20, nat: -25, next: 3, isGood: false, points: 0, feedback: "La corrupción destruye la sociedad y el ambiente." }
                ]
            },
            {

                text: "Jefe, con el impuesto encima, necesitamos cambiar. Podemos implementar un sistema agroforestal o usar químicos baratos.",

            {
